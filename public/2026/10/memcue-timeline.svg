<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>memcue с 19 по 27 октября: версии, на которых менялась схема</title>
  <rect width="860" height="560" rx="12" fill="#fcfcfb"/>
  <text x="24" y="40" font-size="17" font-weight="600" fill="#0b0b0b">memcue с 19 по 27 октября: версии, на которых менялась схема</text>

  <line x1="196" y1="70" x2="196" y2="530" stroke="#b9b8b2" stroke-width="2"/>

  <g font-size="14">
    <g transform="translate(0,80)">
      <text x="24" y="5" fill="#52514e">19.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.1.0</text>
      <circle cx="196" cy="0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">факты в SQLite, два факта в каждый промпт, модель извлекает факты из транскрипта</text>
    </g>
    <g transform="translate(0,130)">
      <text x="24" y="5" fill="#52514e">19.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.1.5</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">dream: дубли и опровергнутые факты уходят из выдачи</text>
    </g>
    <g transform="translate(0,180)">
      <text x="24" y="5" fill="#52514e">20.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.2.1</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">извлечённое — кандидаты на проверку; карточка правил на старте сессии</text>
    </g>
    <g transform="translate(0,230)">
      <text x="24" y="5" fill="#52514e">21–23.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.3–0.6</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">судья Jev переставляет найденное; векторы bge-m3 добавлены и убраны</text>
    </g>
    <g transform="translate(0,280)">
      <text x="24" y="5" fill="#52514e">24.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.7.0</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">снова только слова: порядок BM25, судья выключен, локальная модель снята</text>
    </g>
    <g transform="translate(0,330)">
      <text x="24" y="5" fill="#52514e">24.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.8.0</text>
      <circle cx="196" cy="0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">pull: в промпт ничего не подставляется, агент ищет в памяти сам</text>
    </g>
    <g transform="translate(0,380)">
      <text x="24" y="5" fill="#52514e">25.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.12.0</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">у факта есть перевод: русский факт находится английским запросом</text>
    </g>
    <g transform="translate(0,430)">
      <text x="24" y="5" fill="#52514e">26.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.19.0</text>
      <circle cx="196" cy="0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">агент пишет память сам, извлечения из транскриптов больше нет</text>
    </g>
    <g transform="translate(0,480)">
      <text x="24" y="5" fill="#52514e">27.10</text><text x="170" y="5" text-anchor="end" font-weight="600" fill="#0b0b0b">0.21.0</text>
      <circle cx="196" cy="0" r="6" fill="#b9b8b2" stroke="#fcfcfb" stroke-width="2"/>
      <text x="216" y="5" fill="#0b0b0b">без карантина: записанный факт сразу виден поиску</text>
    </g>
  </g>
  <text x="216" y="530" font-size="12" fill="#52514e">Синим — исходная схема и два её поворота. Всего 33 релиза и 418 коммитов.</text>
</svg>
