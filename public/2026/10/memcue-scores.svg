<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Средняя оценка ответа агента по режимам памяти</title>
  <rect width="860" height="500" rx="12" fill="#fcfcfb"/>

  <!-- panel A -->
  <text x="24" y="40" font-size="17" font-weight="600" fill="#0b0b0b">Против файловой памяти · memcue 0.6.0, 23 октября</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="230" y1="56" x2="230" y2="200"/><line x1="360" y1="56" x2="360" y2="200"/>
    <line x1="490" y1="56" x2="490" y2="200"/><line x1="620" y1="56" x2="620" y2="200"/>
    <line x1="750" y1="56" x2="750" y2="200"/>
  </g>
  <g font-size="14" fill="#0b0b0b" text-anchor="end">
    <text x="218" y="80">без памяти</text>
    <text x="218" y="116">файлы и MEMORY.md</text>
    <text x="218" y="152">memcue: слова</text>
    <text x="218" y="188">memcue: слова и судья</text>
  </g>
  <g>
    <rect x="230" y="64" width="218.4" height="22" rx="4" fill="#b9b8b2"/>
    <rect x="230" y="100" width="231.4" height="22" rx="4" fill="#b9b8b2"/>
    <rect x="230" y="136" width="252.2" height="22" rx="4" fill="#b9b8b2"/>
    <rect x="230" y="172" width="278.2" height="22" rx="4" fill="#2a78d6"/>
  </g>
  <g font-size="14" fill="#0b0b0b">
    <text x="456" y="80">0.84 · $30.19</text>
    <text x="469" y="116">0.89 · $42.19</text>
    <text x="490" y="152">0.97 · $32.07</text>
    <text x="516" y="188" font-weight="600">1.07 · $30.74</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="230" y="218">0</text><text x="360" y="218">0.5</text><text x="490" y="218">1</text>
    <text x="620" y="218">1.5</text><text x="750" y="218">2</text>
  </g>

  <!-- panel B -->
  <text x="24" y="262" font-size="17" font-weight="600" fill="#0b0b0b">Push против pull · memcue 0.8.0, 24 октября</text>
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="230" y1="278" x2="230" y2="422"/><line x1="360" y1="278" x2="360" y2="422"/>
    <line x1="490" y1="278" x2="490" y2="422"/><line x1="620" y1="278" x2="620" y2="422"/>
    <line x1="750" y1="278" x2="750" y2="422"/>
  </g>
  <g font-size="14" fill="#0b0b0b" text-anchor="end">
    <text x="218" y="302">без памяти</text>
    <text x="218" y="338">push: факты в промпт</text>
    <text x="218" y="374">pull: агент ищет сам</text>
    <text x="218" y="410">push и pull вместе</text>
  </g>
  <g>
    <rect x="230" y="286" width="197.6" height="22" rx="4" fill="#b9b8b2"/>
    <rect x="230" y="322" width="231.4" height="22" rx="4" fill="#b9b8b2"/>
    <rect x="230" y="358" width="280.8" height="22" rx="4" fill="#2a78d6"/>
    <rect x="230" y="394" width="257.4" height="22" rx="4" fill="#b9b8b2"/>
  </g>
  <g font-size="14" fill="#0b0b0b">
    <text x="436" y="302">0.76 · $30.19</text>
    <text x="469" y="338">0.89 · $31.43</text>
    <text x="519" y="374" font-weight="600">1.08 · $33.75</text>
    <text x="495" y="410">0.99 · $31.36</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="230" y="440">0</text><text x="360" y="440">0.5</text><text x="490" y="440">1</text>
    <text x="620" y="440">1.5</text><text x="750" y="440">2</text>
  </g>

  <g font-size="12" fill="#52514e">
    <text x="24" y="470">Средняя оценка ответа от 0 до 2 и цена 80 прогонов: 40 реальных промптов × 2 повтора claude -p --model opus, оценка вслепую.</text>
    <text x="24" y="488">Панели оценены в разных партиях, поэтому одни и те же прогоны без памяти получили 0.84 и 0.76.</text>
  </g>
</svg>
